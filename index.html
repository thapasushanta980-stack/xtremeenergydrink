<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#07062a" />
    <title>XTREME Energy Drink — No Pause. No Limits.</title>
    <meta name="description" content="Xtreme Energy Drink. Built for the moments that demand more. Nepal's energy, unleashed." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load out of the critical path: a slow or blocked fonts.googleapis.com
         must not keep the page from painting. The display fallbacks in styles.css
         carry the layout until Anton and Space Grotesk arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" /></noscript>

    <!--
      The pour, inline and complete.

      Everything the first frame needs is in this document: no stylesheet, no
      script module and no image. The page therefore never shows the gap it used
      to between the HTML painting and React mounting. Nothing here uses a web
      font either, so no text in the splash can re-render when Anton and Space
      Grotesk arrive - the wordmark is drawn, and the readout is pinned to fonts
      the device already has.

      The can and glass are CSS: logo.png is 294 KB and can-front.png is 1.2 MB,
      which is the wrong order of magnitude for something shown before anything
      else has loaded.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 500;
        background:
          radial-gradient(circle at 50% 43%, rgba(48, 65, 164, 0.25), transparent 35%),
          radial-gradient(circle at 50% 115%, rgba(45, 61, 168, 0.19), transparent 42%),
          #07062a;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 20px;
        overflow: hidden;
        isolation: isolate;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #splash::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.7;
        background-image:
          radial-gradient(circle, rgba(167, 184, 255, 0.58) 1px, transparent 1.8px),
          radial-gradient(circle, rgba(246, 192, 38, 0.45) 1px, transparent 1.8px);
        background-size: 141px 137px, 211px 193px;
        background-position: 24px 11px, 92px 61px;
        animation: sp-stars 11s linear infinite;
      }
      @keyframes sp-stars { to { transform: translateY(72px); opacity: 0.35; } }
      #splash.is-done { opacity: 0; visibility: hidden; }
      .sp-stage { position: relative; width: 260px; height: 275px; filter: drop-shadow(0 24px 42px rgba(31, 48, 186, 0.25)); }
      .sp-stage::before {
        content: '';
        position: absolute;
        left: 35px;
        top: 38px;
        width: 196px;
        height: 196px;
        border: 1px solid rgba(126, 149, 255, 0.17);
        border-radius: 50%;
        box-shadow: 0 0 0 18px rgba(110, 129, 255, 0.025), inset 0 0 35px rgba(100, 120, 255, 0.08);
        animation: sp-halo 3.2s ease-in-out infinite;
      }
      @keyframes sp-halo { 50% { transform: scale(1.07); opacity: 0.52; } }

      /* The can: a lit aluminium cylinder with the gold X across its waist. */
      .sp-can {
        position: absolute;
        left: 17px;
        top: 4px;
        width: 62px;
        height: 132px;
        border-radius: 11px / 7px;
        transform: rotate(126deg);
        background:
          linear-gradient(180deg, #cfd7f9 0 5%, transparent 5% 94%, #abbcf4 94% 100%),
          linear-gradient(90deg, #111a5c, #273fac 19%, #4059d3 48%, #263ba0 78%, #0b164e);
        box-shadow: inset 3px 0 7px rgba(255,255,255,0.17), inset -6px 0 12px rgba(0,0,0,0.3), 0 12px 34px rgba(0, 0, 0, 0.5);
        animation: sp-can-float 2.4s ease-in-out infinite;
      }
      @keyframes sp-can-float { 50% { transform: rotate(129deg) translateY(-4px); } }
      .sp-can::before {
        content: '';
        position: absolute;
        inset: 6% 7%;
        border-inline: 1px solid rgba(255, 255, 255, 0.2);
      }
      .sp-wordmark {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) rotate(-90deg);
        color: #f5f8ff;
        font: 900 20px/1 Impact, 'Arial Narrow', sans-serif;
        letter-spacing: 0.015em;
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65), 0 0 9px rgba(183, 205, 255, 0.48);
      }
      .sp-spark {
        position: absolute;
        left: 89px;
        top: 87px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #e8f1ff;
        box-shadow: 0 0 13px #b6cbff, 0 0 25px #6078ff;
        animation: sp-spark 1.5s ease-in-out infinite;
      }
      @keyframes sp-spark { 50% { transform: translate(4px, 8px) scale(0.45); opacity: 0.45; } }

      .sp-stream {
        position: absolute;
        left: 101px;
        top: 91px;
        width: 5px;
        height: 59px;
        border-radius: 4px;
        background: linear-gradient(180deg, rgba(208, 226, 255, 0), #e3eeff 18%, #6c80ff 49%, #b1c2ff);
        box-shadow: 0 0 13px rgba(100, 119, 255, 0.75);
        transform-origin: 50% 0;
        animation: sp-pour 1.1s ease-in-out infinite alternate;
      }
      @keyframes sp-pour {
        from { transform: scaleX(0.78) skewX(-3deg); }
        to { transform: scaleX(1.14) skewX(3deg); }
      }

      .sp-glass {
        position: absolute;
        left: 75px;
        top: 149px;
        width: 112px;
        height: 120px;
        overflow: hidden;
        border: 1px solid rgba(192, 204, 255, 0.65);
        border-top: 1px solid rgba(192, 204, 255, 0.28);
        border-radius: 3px 3px 30px 30px / 3px 3px 24px 24px;
        background: linear-gradient(104deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.02) 42%, rgba(255, 255, 255, 0.09));
        box-shadow: inset 0 -12px 26px rgba(90, 108, 255, 0.16), 0 18px 45px rgba(40, 60, 230, 0.26), 0 0 32px rgba(86, 107, 255, 0.12);
      }
      /* Height is the progress readout: the cup fills as the page loads. */
      .sp-liquid {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0;
        background: linear-gradient(180deg, #536bf3 0%, #3046c3 40%, #17267d 100%);
        box-shadow: inset 0 16px 28px rgba(255, 255, 255, 0.14);
      }
      .sp-liquid::before {
        content: '';
        position: absolute;
        left: -50%;
        right: -50%;
        top: -7px;
        height: 14px;
        border-radius: 50%;
        background: #6e83ff;
        animation: sp-wave 2.6s ease-in-out infinite alternate;
      }
      .sp-liquid::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: -3px;
        height: 4px;
        background: rgba(194, 215, 255, 0.55);
        filter: blur(2px);
      }
      @keyframes sp-wave {
        from { transform: translateX(-7%) rotate(-0.5deg); }
        to { transform: translateX(7%) rotate(0.5deg); }
      }
      .sp-liquid i {
        position: absolute;
        bottom: 4px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        animation: sp-bub 2.4s ease-in infinite;
      }
      .sp-liquid i:nth-child(1) { left: 22%; animation-delay: 0.1s; }
      .sp-liquid i:nth-child(2) { left: 52%; width: 3px; height: 3px; animation-delay: 0.8s; }
      .sp-liquid i:nth-child(3) { left: 76%; animation-delay: 1.5s; }
      @keyframes sp-bub {
        0% { transform: translateY(0); opacity: 0; }
        18% { opacity: 0.75; }
        100% { transform: translateY(-74px); opacity: 0; }
      }

      /* System fonts only, so nothing in the splash can reflow when the web
         fonts land. This is the text that used to flash. */
      .sp-meta {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 18px;
        font: 600 11px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(247, 246, 255, 0.55);
      }
      .sp-meta b {
        font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        color: #bfd0ff;
        font-variant-numeric: tabular-nums;
      }
      .sp-meta b::after { content: '%'; margin-left: 3px; opacity: 0.66; }
      .sp-caption {
        position: relative;
        margin: 3px 0 0;
        color: rgba(214, 222, 255, 0.42);
        font: 600 9px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.4em;
        text-transform: uppercase;
      }
      /* ---- Dashain, 11-25 October. The splash runs before any module, so it
         works out the season for itself; src/dashain.ts holds the real dates
         and this mirrors them. Kites drift behind the pour, and the readout
         greets you in Devanagari - set in a face the device already has, like
         everything else here, so nothing in the splash can reflow. */
      .sp-kite {
        position: absolute;
        width: 22px;
        height: 28px;
        opacity: 0;
        clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%);
        animation: sp-fly 15s linear infinite;
      }
      .sp-kite::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 100%;
        width: 1px;
        height: 16px;
        background: currentColor;
        opacity: 0.6;
      }
      #splash.is-dashain .sp-kite { opacity: 1; }
      .sp-k1 { left: 8%; top: 22%; background: #e5203b; color: #e5203b; animation-delay: -1s; }
      .sp-k2 { right: 11%; top: 16%; background: #f6c026; color: #f6c026; transform: scale(0.72); animation-delay: -6s; }
      .sp-k3 { right: 22%; bottom: 20%; background: #1fa65a; color: #1fa65a; transform: scale(0.54); animation-delay: -11s; }
      @keyframes sp-fly {
        0% { transform: translate(0, 0) rotate(-8deg); }
        50% { transform: translate(26px, -22px) rotate(10deg); }
        100% { transform: translate(0, 0) rotate(-8deg); }
      }
      .sp-deva, .sp-cap-deva { display: none; }
      #splash.is-dashain .sp-pour, #splash.is-dashain .sp-cap-std { display: none; }
      #splash.is-dashain .sp-deva {
        display: inline;
        font-family: 'Nirmala UI', 'Noto Sans Devanagari', 'Kohinoor Devanagari', system-ui, sans-serif;
        font-size: 15px;
        letter-spacing: 0.06em;
        text-transform: none;
        color: #ffd84a;
      }
      #splash.is-dashain .sp-cap-deva { display: inline; }
      #splash.is-dashain .sp-meta b { color: #ffd84a; }

      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::before, #splash *::after { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="splash" role="status" aria-label="Loading Xtreme">
      <div class="sp-stage" aria-hidden="true">
        <div class="sp-can">
          <span class="sp-wordmark">XTREME</span>
        </div>
        <i class="sp-spark"></i>
        <i class="sp-stream"></i>
        <div class="sp-glass">
          <div class="sp-liquid" data-liquid><i></i><i></i><i></i></div>
        </div>
      </div>
      <i class="sp-kite sp-k1"></i>
      <i class="sp-kite sp-k2"></i>
      <i class="sp-kite sp-k3"></i>
      <p class="sp-meta" aria-hidden="true">
        <span class="sp-pour">Pouring</span><span class="sp-deva">शुभ दशैं</span><b data-pct>00</b>
      </p>
      <p class="sp-caption" aria-hidden="true">
        <span class="sp-cap-std">Fuel the moment</span><span class="sp-cap-deva">Kites up. Fuel the moment.</span>
      </p>
    </div>

    <script>
      /*
        The splash controller. It runs before the bundle, so the cup is already
        filling on the first frame; the app takes the dial over through
        window.__splash as soon as it mounts. Written in plain ES5 on purpose:
        it must run even if the module bundle never arrives.
      */
      (function () {
        var el = document.getElementById('splash');
        if (!el) return;
        document.documentElement.classList.add('is-loading');

        // Dashain, worked out here because nothing else has loaded yet. These
        // two dates mirror DASHAIN.opens / DASHAIN.closes in src/dashain.ts,
        // which is the source of truth; ?dashain=1 / =0 overrides, as there.
        try {
          var q = location.search.match(/[?&]dashain=([01])/);
          var now = Date.now();
          var on = q ? q[1] === '1' : now >= Date.parse('2026-10-04T00:00:00') && now < Date.parse('2026-10-26T00:00:00');
          if (on) el.classList.add('is-dashain');
        } catch (e) {
          /* a splash is not worth failing over */
        }

        var liquid = el.querySelector('[data-liquid]');
        var num = el.querySelector('[data-pct]');
        var shown = 0;
        var target = 0;
        var raf = 0;
        var gone = false;

        function paint() {
          raf = 0;
          var d = target - shown;
          shown += Math.abs(d) < 0.3 ? d : d * 0.14;
          liquid.style.height = shown.toFixed(1) + '%';
          num.textContent = (shown < 9.5 ? '0' : '') + Math.round(shown);
          if (Math.abs(target - shown) > 0.3) raf = requestAnimationFrame(paint);
        }

        // Progress only ever moves forward: the cup must never appear to drain.
        function set(p) {
          p = Math.max(0, Math.min(100, p));
          if (p > target) target = p;
          if (!raf) raf = requestAnimationFrame(paint);
        }

        // Fill on our own until the app takes over, so a slow bundle still
        // shows something pouring rather than a frozen cup.
        var crawl = setInterval(function () {
          set(Math.min(72, target + 7));
        }, 200);
        set(8);

        function done(cb) {
          // Already gone still has to call back, or whoever is waiting on this
          // would wait forever and leave the page scroll-locked.
          if (gone) {
            if (cb) cb();
            return;
          }
          gone = true;
          clearInterval(crawl);
          cancelAnimationFrame(raf);
          raf = 0;
          shown = target = 100;
          liquid.style.height = '100%';
          num.textContent = '100';
          setTimeout(function () {
            el.classList.add('is-done');
            setTimeout(function () {
              el.remove();
              document.documentElement.classList.remove('is-loading');
              if (cb) cb();
            }, 520);
          }, 300);
        }

        window.__splash = {
          get: function () {
            return target;
          },
          set: function (p) {
            clearInterval(crawl);
            set(p);
          },
          done: done
        };

        // Last resort. The splash must never outlive the page, whatever fails.
        setTimeout(function () {
          done();
        }, 9000);
      })();
    </script>

    <noscript>
      <style>
        #splash { display: none; }
      </style>
      <div style="max-width: 48ch; margin: 18vh auto; padding: 0 24px; font: 400 16px/1.6 system-ui, sans-serif; color: #f7f6ff; text-align: center">
        <h1 style="font: 400 40px/1 Impact, sans-serif; letter-spacing: 0.02em; text-transform: uppercase">Xtreme Energy Drink</h1>
        <p style="margin-top: 16px; opacity: 0.7">This page needs JavaScript for its 3D product stage. For stockists, distribution or bulk orders, write to
          <a href="mailto:hello@xtreme.com.np" style="color: #ffd84a">hello@xtreme.com.np</a>.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
